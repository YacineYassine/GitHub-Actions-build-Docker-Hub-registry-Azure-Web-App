<!DOCTYPE html>
<html>
<head>
    <title>Classificateur Iris</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <h1>🌺 Classificateur Iris</h1>
    
    <form id="irisForm">
        <div class="form-group">
            <label>Longueur sépale (cm):</label>
            <input type="number" step="0.1" id="sepal_length" required>
        </div>
        
        <div class="form-group">
            <label>Largeur sépale (cm):</label>
            <input type="number" step="0.1" id="sepal_width" required>
        </div>
        
        <div class="form-group">
            <label>Longueur pétale (cm):</label>
            <input type="number" step="0.1" id="petal_length" required>
        </div>
        
        <div class="form-group">
            <label>Largeur pétale (cm):</label>
            <input type="number" step="0.1" id="petal_width" required>
        </div>
        
        <button type="submit">Prédire</button>
    </form>

    <div id="result" class="result" style="display:none;"></div>
    <div id="feedback" style="display:none;">
        <p>La prédiction est-elle correcte?</p>
        <button onclick="sendFeedback(true)">👍 Oui</button>
        <button onclick="sendFeedback(false)">👎 Non</button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
