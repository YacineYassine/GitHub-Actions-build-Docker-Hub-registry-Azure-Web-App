name: Deploy to EC2

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install rsync
      run: sudo apt-get update && sudo apt-get install -y rsync

    - name: Deploy to EC2 via Rsync
      run: |
        rsync -avz --delete \
          --exclude='.env' \
          --exclude='.git' \
          --exclude='__pycache__' \
          ./ ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/iris-app/

    - name: Install Dependencies and Restart App
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/iris-app
          pip3 install -r requirements.txt
          pip3 install python-dotenv psycopg2-binary
          sudo pkill gunicorn || true
          gunicorn --bind 0.0.0.0:5000 src.app:app --daemon