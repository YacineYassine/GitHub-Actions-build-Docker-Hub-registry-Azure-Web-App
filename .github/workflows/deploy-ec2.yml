name: Deploy to EC2

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy and Restart App
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Créer la structure
          mkdir -p /home/ec2-user/iris-app
          
          # Clone propre depuis GitHub
          cd /tmp
          rm -rf deploy-temp
          git clone https://github.com/YacineYassine/GitHub-Actions-build-Docker-Hub-registry-Azure-Web-App deploy-temp
          cd deploy-temp
          git checkout dev
          
          # Copier les fichiers (exclure .env)
          rsync -av --exclude='.env' --exclude='.git' --exclude='__pycache__' ./ /home/ec2-user/iris-app/
          
          # Installer et démarrer
          cd /home/ec2-user/iris-app
          pip3 install -r requirements.txt
          pip3 install python-dotenv psycopg2-binary
          sudo pkill gunicorn || true
          gunicorn --bind 0.0.0.0:5000 src.app:app --daemon
          
          # Nettoyer
          rm -rf /tmp/deploy-temp