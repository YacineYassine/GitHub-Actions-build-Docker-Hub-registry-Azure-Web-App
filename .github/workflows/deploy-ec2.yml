name: Deploy to ECR and EC2

on:
  push:
    branches: [ dev ]

env:
  AWS_REGION: ca-central-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: iris-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Debug ECR Variables
      run: |
        echo "ECR_REGISTRY: $ECR_REGISTRY"
        echo "ECR_REPOSITORY: $ECR_REPOSITORY" 
        echo "IMAGE_TAG: $IMAGE_TAG"
        echo "Registry from login: ${{ steps.login-ecr.outputs.registry }}"

    - name: Build, tag, and push image to Amazon ECR
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/iris-app:$IMAGE_TAG .
        docker push ${{ steps.login-ecr.outputs.registry }}/iris-app:$IMAGE_TAG

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # ARRÊTER l'ancienne app Flask
          sudo pkill -f "python.*app.py" || true
          sudo pkill -f gunicorn || true
          sleep 2
          
          # DÉPLOIEMENT Docker avec variables d'environnement
          aws ecr get-login-password --region ca-central-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}
          docker stop iris-app || true
          docker rm iris-app || true
          docker run -d -p 5000:5000 --name iris-app \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}
         # modifier